<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TranscriptKit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon" aria-hidden="true">
        <path d="M4 6h16M4 12h10M4 18h14"/>
      </svg>
      <span>TranscriptKit</span>
    </div>
    <div id="stats" class="stats-badge" hidden></div>
  </header>

  <section id="msg" class="msg-box" hidden aria-live="polite">
    <div id="msgIcon" class="msg-icon"></div>
    <div id="msgText" class="msg-text"></div>
    <div id="msgAction" class="msg-action" hidden></div>
  </section>

  <main id="main" hidden>
    <div class="video-meta">
      <div id="title" class="video-title"></div>
      <div id="author" class="video-author"></div>
    </div>

    <div class="field-row">
      <label for="lang" class="field-label">Language</label>
      <select id="lang" class="field-select"></select>
    </div>

    <div class="formats-bar" role="tablist" aria-label="Export Formats">
      <button type="button" class="fmt-btn active" data-fmt="txt" role="tab" aria-selected="true">Text</button>
      <button type="button" class="fmt-btn" data-fmt="srt" role="tab" aria-selected="false">SRT</button>
      <button type="button" class="fmt-btn" data-fmt="md" role="tab" aria-selected="false">Markdown</button>
    </div>

    <div class="search-row">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="search" placeholder="Search in transcript..." aria-label="Search transcript">
        <button type="button" id="searchClear" class="search-clear" hidden aria-label="Clear search">✕</button>
      </div>
      <div id="searchMatchCount" class="search-count" hidden></div>
    </div>

    <details class="options-details" id="optionsDetails">
      <summary class="options-summary">Options &amp; Formatting</summary>
      <div class="options-body">
        <label class="check-label">
          <input type="checkbox" id="ts">
          <span>Include timestamps</span>
        </label>
        <label class="check-label">
          <input type="checkbox" id="removeFiller" checked>
          <span>Remove filler <small class="hint">([Music], [Applause])</small></span>
        </label>
        <label class="check-label">
          <input type="checkbox" id="merge" checked>
          <span>Merge into paragraphs</span>
        </label>
        <label class="check-label">
          <input type="checkbox" id="includeHeader">
          <span>Include title &amp; video URL header</span>
        </label>
        <label class="check-label" id="chapRow" hidden>
          <input type="checkbox" id="groupByChapters">
          <span>Group by video chapters</span>
        </label>
      </div>
    </details>

    <div class="preview-container">
      <div id="truncationNotice" class="truncation-banner" hidden>
        Showing preview of first 50 lines. Copy &amp; Download will include the full transcript.
      </div>
      <textarea id="preview" readonly spellcheck="false" aria-label="Transcript preview"></textarea>
    </div>

    <div class="actions">
      <button type="button" id="copy" class="btn primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
        <span id="copyText">Copy</span>
      </button>
      <button type="button" id="download" class="btn secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Download</span>
      </button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
