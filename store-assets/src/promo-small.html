<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo small</title>
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #0e1a2b; }
    .tile {
      width: 440px; height: 280px;
      background: #0e1a2b; color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 22px 24px 26px;
      box-sizing: border-box;
    }
    .icon-wrap {
      width: 64px; height: 64px;
      background: #f2f5f7;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-wrap img { width: 64px; height: 64px; display: block; }
    h1 {
      margin: 0; font-size: 36px; letter-spacing: -0.04em;
      font-weight: 700; line-height: 1;
    }
    p {
      margin: 12px 0 0; font-size: 18px; font-weight: 600;
      color: #d7dee8; letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="tile">
    <div class="icon-wrap"><img src="../../icons/128.png" alt=""></div>
    <h1>TranscriptKit</h1>
    <p>Copy YouTube transcripts instantly</p>
  </div>
</body>
</html>
