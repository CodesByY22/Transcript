<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screenshot 1</title>
  <link rel="stylesheet" href="shot-frame.css">
  <link rel="stylesheet" href="tk-popup.css">
</head>
<body>
  <div class="stage">
    <div class="browser">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="omnibox">watch.example.com/lecture/sampling-strategies</div>
    </div>
    <div class="page">
      <div class="player">
        <div class="blob a"></div>
        <div class="blob b"></div>
        <div class="blob c"></div>
        <div class="vid-meta">Lecture 12 · 18:42</div>
        <div class="progress"><i></i></div>
      </div>
      <div class="headline">
        <h1>Copy any YouTube transcript<br>in one click</h1>
        <p>Preview, then Copy or Download — no extra tabs.</p>
      </div>
      <div class="popup-slot">
        <div class="tk-popup">
          <header>
            <div class="brand">
              <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>TranscriptKit</span>
            </div>
            <div class="stats-badge">412 words · ~3 min</div>
          </header>
          <main>
            <div class="video-meta">
              <div class="video-title">Sampling strategies for field research</div>
              <div class="video-author">Open Methods Lab</div>
            </div>
            <div class="field-row">
              <label class="field-label">Language</label>
              <div class="fake-select"><span>English</span></div>
            </div>
            <div class="formats-bar">
              <button class="fmt-btn active" type="button">Text</button>
              <button class="fmt-btn" type="button">SRT</button>
              <button class="fmt-btn" type="button">Markdown</button>
            </div>
            <div class="search-row">
              <div class="search-wrap">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" placeholder="Search in transcript..." value="" readonly>
              </div>
            </div>
            <div class="options-details">
              <div class="options-summary">Options &amp; Formatting</div>
            </div>
            <div class="preview-container">
              <textarea readonly>Research methods start with a clear question. You define the population, pick a sampling strategy, and decide how you will measure the outcome.

A good study design reduces bias before you collect a single data point. Randomization helps, but it is not a substitute for careful measurement.

When you write up results, separate what you observed from what you infer. Readers should be able to follow both the method and the limits of the claim.</textarea>
            </div>
            <div class="actions">
              <button class="btn primary" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                Copy
              </button>
              <button class="btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download
              </button>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
